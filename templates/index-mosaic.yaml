apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: index-mosaic-
  namespace: argo
spec:
  entrypoint: workflow-entrypoint
  # serviceAccountName: public-bucket-writer # DEP Staging
  serviceAccountName: open-data-bucket-writer # DEP Prod
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 600s
  podMetadata:
    labels:
      app: ls-geomad
    annotations:
      karpenter.sh/do-not-disrupt: "true"
  # TODO: Need to disactivate all dep-specific tags to run non-Pacific processes in another Argo instance.
  nodeSelector:
    karpenter.sh/capacity-type: "spot" # Just to be explicit. In dep-terraform, the data-processing nodepool can only pick spot instances
    # dep/workload: data-processing # DEP Staging
    dep/workload: data-processing-public # DEP Prod
  tolerations:
    - key: dep/workload
      operator: Equal
      # value: data-processing # DEP Staging
      value: data-processing-public # DEP Prod
      effect: NoSchedule
  arguments:
    parameters:
      - name: image-name
        value: "ghcr.io/auspatious/ldn-lulc"
      - name: image-tag
        value: "latest"
      - name: dataset
        # "geomad", or "lulc"
        value: "geomad"
        # value: "lulc"
      - name: region
        # "all", "pacific", or "non-pacific"
        value: "all"

  templates:
    - name: workflow-entrypoint
      dag:
        tasks:
          - name: index-to-stac-geoparquet
            template: index-to-stac-geoparquet

          - name: make-geomad-collection
            depends: index-to-stac-geoparquet.Succeeded
            template: make-geomad-collection

          - name: make-mosaics
            depends: index-to-stac-geoparquet.Succeeded
            template: make-mosaics

    - name: index-to-stac-geoparquet
      activeDeadlineSeconds: 900 # 15 mins
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: Always
        # imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 2Gi
            cpu: 1
        command: [ldn]
        args:
          - index-to-stac-geoparquet
          - --dataset
          - "{{ workflow.parameters.dataset }}"
          - --region
          - "{{ workflow.parameters.region }}"

      # Make the collection here because it depends on the index.
    - name: make-geomad-collection
      activeDeadlineSeconds: 900 # 15 mins
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: IfNotPresent
        command: [ldn]
        args:
          - create-collection
          - --dataset
          - "{{ workflow.parameters.dataset }}"
          - --stac-geoparquet-url # TODO: Get from index output
          - "{{ tasks.index-to-stac-geoparquet.outputs.result }}"
          - --single-region # TODO: Get from index output
          - "{{ tasks.index-to-stac-geoparquet.outputs.result }}"

    - name: make-mosaics
      activeDeadlineSeconds: 900 # 15 mins
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: Always
        # imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 2Gi
            cpu: 1
        command: [ldn]
        args:
          - make-mosaics
          - --dataset
          - "{{ workflow.parameters.dataset }}"
