apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: landsat-lulc-classify-
  namespace: argo
spec:
  entrypoint: workflow-entrypoint
  serviceAccountName: public-bucket-writer
  podGC:
    strategy: OnWorkflowSuccess
    deleteDelayDuration: 600s
  parallelism: 50
  podMetadata:
    labels:
      app: ls-lulc-classify
    annotations:
      karpenter.sh/do-not-disrupt: "true"
  nodeSelector:
    karpenter.sh/capacity-type: "spot"
    # TODO: Need to disactivate all dep-specific tags to run non-Pacific processes in another Argo instance.
    dep/workload: data-processing
  tolerations:
    - key: dep/workload
      operator: Equal
      value: data-processing
      effect: NoSchedule
  arguments:
    parameters:
      - name: image-name
        value: "ghcr.io/auspatious/ldn-lulc"
      - name: image-tag
        value: "latest"
      - name: prediction-version
        value: "0-0-4"
      - name: geomad-version
        value: "0-2-1"
      - name: region
        # Just run Pacific in DEP Argo instance.
        value: "pacific" # "all", "pacific", or "non-pacific"
      - name: years
        value: "2025" # "2000-2025" or "2000,2005,2010"
      - name: overwrite
        value: "--no-overwrite" # Can be "--overwrite" or "--no-overwrite"
      - name: decimated
        value: "--no-decimated" # Can be "--decimated" or "--no-decimated"
  templates:
    - name: workflow-entrypoint
      dag:
        tasks:
          # - name: print-tasks
          #   template: print-tasks

          # - name: filter-tasks
          #   depends: print-tasks.Succeeded
          #   template: filter-tasks
          #   arguments:
          #     parameters:
          #       - name: tasks-json
          #         value: "{{ tasks.print-tasks.outputs.result }}"

          - name: classify
            # depends: filter-tasks.Succeeded # TODO: Reenable after test.
            template: classify
            arguments:
              parameters:
                - name: tile-id
                  value: "{{item.id}}"
                - name: year
                  value: "{{item.year}}"
                - name: region
                  value: "{{item.region}}"
            # withParam: "{{ tasks.filter-tasks.outputs.result }}"
            withParam: '[{"id": "063_020","year": "2020","region": "pacific"},{"id": "76_24","year": "2020","region": "pacific"},{"id": "089_016","year": "2020","region": "pacific"},{"id": "028_030","year": "2020","region": "pacific"},{"id": "058_043","year": "2020","region": "pacific"}]'

    # - name: print-tasks
    #   container:
    #     image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
    #     imagePullPolicy: IfNotPresent
    #     resources:
    #       requests:
    #         memory: 18Gi
    #         cpu: 10
    #     command: [ldn]
    #     args:
    #       - print-tasks
    #       - --years
    #       - "{{ workflow.parameters.years }}"
    #       - --region
    #       - "{{ workflow.parameters.region }}"

    # - name: filter-tasks
    #   inputs:
    #     parameters:
    #       - name: tasks-json
    #   container:
    #     image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
    #     imagePullPolicy: IfNotPresent
    #     resources:
    #       requests:
    #         memory: 18Gi
    #         cpu: 10
    #     command: [ldn]
    #     args:
    #       - filter-tasks
    #       - --tasks-json
    #       - "{{ inputs.parameters.tasks-json }}"
    #       - --version
    #       - "{{ workflow.parameters.prediction-version }}"
    #       - --dataset
    #       - "prediction"
    #       - "{{ workflow.parameters.overwrite }}"

    - name: classify
      inputs:
        parameters:
          - name: tile-id
          - name: year
          - name: region
      retryStrategy:
        limit: "3"
        retryPolicy: OnFailure
        # Don't retry OOMKills (137)
        expression: "asInt(lastRetry.exitCode) != 137"
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 8Gi
            cpu: 4
          limits:
            memory: 12Gi
            cpu: 6
        command: [ldn]
        args:
          - classify
          - classify
          - --tile-id
          - "{{ inputs.parameters.tile-id }}"
          - --year
          - "{{ inputs.parameters.year }}"
          - --region
          - "{{ inputs.parameters.region }}"
          - --version
          - "{{ workflow.parameters.prediction-version }}"
          - --version-geomad
          - "{{ workflow.parameters.geomad-version }}"
          - "{{ workflow.parameters.decimated }}"
          - "{{ workflow.parameters.overwrite }}"
