apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: landsat-lulc-classify-
  namespace: argo
spec:
  entrypoint: workflow-entrypoint
  serviceAccountName: public-bucket-writer # DEP Staging
  # serviceAccountName: open-data-bucket-writer # DEP Prod
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 600s
  parallelism: 50
  podMetadata:
    labels:
      app: ls-lulc-classify
    annotations:
      karpenter.sh/do-not-disrupt: "true"
  # TODO: Need to disactivate all dep-specific tags to run non-Pacific processes in another Argo instance.
  nodeSelector:
    karpenter.sh/capacity-type: "spot" # Just to be explicit. In dep-terraform, the data-processing nodepool can only pick spot instances
    dep/workload: data-processing # DEP Staging
    # dep/workload: data-processing-public # DEP Prod
  tolerations:
    - key: dep/workload
      operator: Equal
      value: data-processing # DEP Staging
      # value: data-processing-public # DEP Prod
      effect: NoSchedule
  arguments:
    parameters:
      - name: image-name
        value: "ghcr.io/auspatious/ldn-lulc"
      - name: image-tag
        value: "0.2.0-cf745a0" # Latest main image. There is no 0.2.0 release image yet.
      - name: lulc-version
        value: "0-2-0"
      - name: geomad-version
        value: "0-2-1"
      - name: geomad-bucket
        value: "us-west-2.opendata.source.coop" # Source Coop bucket has both regions' geomad
      - name: output-bucket
        value: "dep-public-staging" # DEP Staging
        # value: "dep-public-data" # DEP Prod
      - name: region
        value: "all" # "all", "pacific", or "non-pacific"
      - name: years
        value: "2000,2005,2010,2015,2020,2025" # Only used by print-tasks, which is off for the test tile run.
      - name: model-path
        value: "https://dep-public-staging.s3.us-west-2.amazonaws.com/dep_ls_lulc/models/0-2-0/lulc_random_forest_model.joblib"
      - name: collection-url-root
        value: "https://stac.staging.digitalearthpacific.io/collections" # DEP Staging
        # value: "https://stac.digitalearthpacific.org/collections" # DEP Prod
        # value: "" # For Source Coop, leave empty so collection-url-root defaults. "None" would be used as the URL.
      - name: single-region-geomad
        # value: "--single-region-geomad" # DEP: GeoMAD from the dep_ls_geomad index (e.g. dep-public-staging)
        value: "--no-single-region-geomad" # Source.Coop: GeoMAD from the 2-region ls_geomad index on Source.Coop
      - name: overwrite
        value: "--no-overwrite"
      - name: decimated
        value: "--no-decimated"
      - name: gap-fill-years # Fill nodata pixels from the nearest year with data, up to this many years either side
        value: "2"
  templates:
    - name: workflow-entrypoint
      dag:
        tasks:
          - name: print-tasks
            template: print-tasks

          - name: lulc-classify
            depends: print-tasks.Succeeded
            template: lulc-classify
            arguments:
              parameters:
                - name: tile-id
                  value: "{{item.id}}"
                - name: year
                  value: "{{item.year}}"
                - name: region
                  value: "{{item.region}}"
            withParam: "{{ tasks.print-tasks.outputs.parameters.tasks }}"
            # withParam: '[{"id": "085_026","year": "2025","region": "pacific"}]'


    - name: print-tasks
      activeDeadlineSeconds: 900 # 15 mins
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          # Requesting a lot of resources for this simple task
          # This is a scheduling trick, if print-tasks requests small, karpenter would
          # provision a small node first (c6.xlarge/large), then process geomad can't fit
          # and has to wait for another node to come up. Not critical, just saves a few minutes
          # of waiting between tasks.
          requests:
            memory: 24Gi
            cpu: 1
          limits:
            memory: 28Gi
            cpu: 2
        command: [sh, -c]
        args:
          - |
            ldn print-tasks \
              --years "{{ workflow.parameters.years }}" \
              --region "{{ workflow.parameters.region }}" \
              --lulc-version "{{ workflow.parameters.lulc-version }}" \
              --geomad-version "{{ workflow.parameters.geomad-version }}" \
              --dataset lulc \
              {{ workflow.parameters.overwrite }} \
              --bucket "{{ workflow.parameters.output-bucket }}" \
              > /tmp/tasks.json
      outputs:
        parameters:
          - name: tasks
            valueFrom:
              path: /tmp/tasks.json

    - name: lulc-classify
      inputs:
        parameters:
          - name: tile-id
          - name: year
          - name: region
      activeDeadlineSeconds: 1500 # 25 mins
      retryStrategy:
        limit: 2
        retryPolicy: OnError
        backoff:
          duration: "2m"
          factor: 2
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            # v0-2-0 test tiles were measured to run at around 24Gi of memory
            memory: 24Gi
            cpu: 1
            ephemeral-storage: 8Gi
          limits:
            memory: 28Gi
            cpu: 2
        command: [ldn]
        args:
          - lulc
          - run
          - --tile-id
          - "{{ inputs.parameters.tile-id }}"
          - --year
          - "{{ inputs.parameters.year }}"
          - --region
          - "{{ inputs.parameters.region }}"
          - --version
          - "{{ workflow.parameters.lulc-version }}"
          - --geomad-version
          - "{{ workflow.parameters.geomad-version }}"
          - --model-path
          - "{{ workflow.parameters.model-path }}"
          - --geomad-bucket
          - "{{ workflow.parameters.geomad-bucket }}"
          - --output-bucket
          - "{{ workflow.parameters.output-bucket }}"
          - "{{ workflow.parameters.single-region-geomad }}"
          - --collection-url-root
          - "{{ workflow.parameters.collection-url-root }}"
          - --memory-limit
          - "7GB"
          - --n-workers
          - "2"
          - --threads-per-worker
          - "8"
          - --xy-chunk-size
          - "1024"
          - --gap-fill-years
          - "{{ workflow.parameters.gap-fill-years }}"
          - "{{ workflow.parameters.decimated }}"
          - "{{ workflow.parameters.overwrite }}"
