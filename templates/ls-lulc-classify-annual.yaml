apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: landsat-lulc-classify-
  namespace: argo
spec:
  entrypoint: workflow-entrypoint
  serviceAccountName: public-bucket-writer # DEP Staging
  # serviceAccountName: open-data-bucket-writer # DEP Prod
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 600s
  parallelism: 50
  podMetadata:
    labels:
      app: ls-lulc-classify
    annotations:
      karpenter.sh/do-not-disrupt: "true"
  # TODO: Need to disactivate all dep-specific tags to run non-Pacific processes in another Argo instance.
  nodeSelector:
    karpenter.sh/capacity-type: "spot" # Just to be explicit. In dep-terraform, the data-processing nodepool can only pick spot instances
    dep/workload: data-processing # DEP Staging
    # dep/workload: data-processing-public # DEP Prod
  tolerations:
    - key: dep/workload
      operator: Equal
      value: data-processing # DEP Staging
      # value: data-processing-public # DEP Prod
      effect: NoSchedule
  arguments:
    parameters:
      - name: image-name
        value: "ghcr.io/auspatious/ldn-lulc"
      - name: image-tag
        value: "latest"
      - name: lulc-version
        value: "0-0-9"
      - name: geomad-version
        value: "0-2-1"
      - name: bucket
        value: "dep-public-staging" # DEP Staging
        # value: "dep-public-data" # DEP Prod
      - name: region
        # Just run Pacific in DEP Argo instance.
        value: "pacific" # "all", "pacific", or "non-pacific"
      - name: years
        value: "2000,2025"
        # Training data is 2020 but predicting on 2025 because there are less gaps than 2020.
      - name: model-path
        value: "https://dep-public-staging.s3.us-west-2.amazonaws.com/dep_ls_lulc/models/0-0-9/pacific/2020/lulc_random_forest_model_pacific_2020.joblib"
      - name: collection-url-root
        value: "https://stac.staging.digitalearthpacific.io/collections" # DEP Staging
        # value: "https://stac.digitalearthpacific.org/collections" # DEP Prod
        # value: None # For Source Coop, let collection-url-root default
      - name: overwrite
        # value: "--overwrite"
        value: "--no-overwrite"
      - name: decimated
        value: "--no-decimated"
  templates:
    - name: workflow-entrypoint
      dag:
        tasks:
          - name: print-tasks
            template: print-tasks

          - name: lulc-classify
            depends: print-tasks.Succeeded
            template: lulc-classify
            arguments:
              parameters:
                - name: tile-id
                  value: "{{item.id}}"
                - name: year
                  value: "{{item.year}}"
                - name: region
                  value: "{{item.region}}"
            withParam: "{{ tasks.print-tasks.outputs.parameters.tasks }}"
            # Test a couple of tasks:
            # withParam: '[{"id": "063_020","year": "2025","region": "pacific"},{"id": "077_019","year": "2025","region": "pacific"}]'

    - name: print-tasks
      activeDeadlineSeconds: 900 # 15 mins
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          # Requesting a lot of resources for this simple task
          # This is a scheduling trick, if print-tasks requests small, karpenter would
          # provision a small node first (c6.xlarge/large), then process geomad can't fit
          # and has to wait for another node to come up. Not critical, just saves a few minutes
          # of waiting between tasks.
          requests:
            memory: 8Gi
            cpu: 3
        command: [sh, -c]
        args:
          - |
            ldn print-tasks \
              --years "{{ workflow.parameters.years }}" \
              --region "{{ workflow.parameters.region }}" \
              --lulc-version "{{ workflow.parameters.lulc-version }}" \
              --geomad-version "{{ workflow.parameters.geomad-version }}" \
              --dataset lulc \
              {{ workflow.parameters.overwrite }} \
              --bucket "{{ workflow.parameters.bucket }}" \
              > /tmp/tasks.json
      outputs:
        parameters:
          - name: tasks
            valueFrom:
              path: /tmp/tasks.json

    - name: lulc-classify
      inputs:
        parameters:
          - name: tile-id
          - name: year
          - name: region
      activeDeadlineSeconds: 900 # 15 mins
      # No retries.
      container:
        image: "{{ workflow.parameters.image-name }}:{{ workflow.parameters.image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 8Gi
            cpu: 3
          limits:
            memory: 12Gi
            cpu: 4
        command: [ldn]
        args:
          - lulc
          - run
          - --tile-id
          - "{{ inputs.parameters.tile-id }}"
          - --year
          - "{{ inputs.parameters.year }}"
          - --region
          - "{{ inputs.parameters.region }}"
          - --version
          - "{{ workflow.parameters.lulc-version }}"
          - --geomad-version
          - "{{ workflow.parameters.geomad-version }}"
          - --model-path
          - "{{ workflow.parameters.model-path }}"
          - --bucket
          - "{{ workflow.parameters.bucket }}"
          - --collection-url-root
          - "{{ workflow.parameters.collection-url-root }}"
          - --memory-limit
          - "6GB"
          - --n-workers
          - "2"
          - --threads-per-worker
          - "4"
          - --xy-chunk-size
          - "1024"
          - "{{ workflow.parameters.decimated }}"
          - "{{ workflow.parameters.overwrite }}"
