[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldn"
version = "0.1.0"
description = "Land Degradation Neutrality Land Use/Land Cover tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
authors = [
    { name = "Alex Leith", email = "alex@auspatious.com" },
    { name = "Fang Yuan", email = "contact@fangyuan.space" },
    { name = "Will Jones", email = "will@auspatious.com" },
]
dependencies = [
    "antimeridian>=0.4.7,<1.0.0",
    "datacube-compute",
    "dep-tools",
    "gdal==3.13.1",
    "geopandas>=1.1.2,<2.0.0",
    "obstore>=0.10.1,<1.0.0",
    "odc-geo>=0.5.0,<0.6.0",
    "odc-stac>=0.5.2,<0.6.0",
    "pandas>=2.3.3,<3.0.0",
    "rasterio>=1.4.3",
    "rustac>=0.9.6,<0.10.0",
    "typer>=0.9.0",
    "xarray>=2025.12.0,<2026.0.0",
    "zarr>=3.1.5,<4.0.0",
    "boto3>=1.42.31,<2.0.0",
    "cogeo-mosaic>=9.1.0,<10.0.0",
    "dask[distributed]>=2026.3.0,<2027.0.0",
    "prometheus-client>=0.24.1,<0.25.0",
    "joblib>=1.5.3,<2.0.0",
    "requests>=2.33.1,<3.0.0",
    "pystac>=1.14.3,<2.0.0",
    "scikit-learn>=1.8.0,<1.9.0", # TODO: Upgrade to make a new model and classification (together for compatibility)
]

[project.scripts]
ldn = "ldn.cli:app"

[tool.uv.sources]
datacube-compute = { git = "https://github.com/auspatious/datacube-compute.git" }
dep-tools = { git = "https://github.com/digitalearthpacific/dep-tools.git" }

[dependency-groups]
dev = [
    "contextily>=1.7.0,<2.0.0",
    "duckdb>=1.4.4,<2.0.0",
    "folium>=0.20.0,<0.21.0",
    "ipykernel>=7.1.0,<8.0.0",
    "ipyleaflet>=0.20.0,<0.21.0",
    "mapclassify>=2.10.0,<3.0.0",
    "matplotlib>=3.10.8,<4.0.0",
    "matplotlib-scalebar>=0.9.0,<0.10.0",
    "pytest>=9.0.2,<10.0.0",
    "pre-commit>=4.5.1,<5.0.0",
    "ruff>=0.15.16,<0.16.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"ldn/cli.py" = ["E402", "I001"]

[tool.hatch.build.targets.wheel]
packages = ["ldn"]
