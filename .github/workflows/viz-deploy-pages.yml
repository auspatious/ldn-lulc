##
# GitHub Actions Workflow: Build and deploy the viz app to GitHub Pages
#
# Builds the static Vite app in viz/ and publishes it to
# https://auspatious.github.io/ldn-lulc/ on push to main.
# Requires Settings > Pages > Source set to "GitHub Actions".
#
# Action SHAs pinned for supply chain security.
# To update: visit each action's releases page, click the tag, and copy
# the full 40-char commit SHA from the tag's commit link.
# e.g. https://github.com/actions/checkout/releases/tag/v7.0.1
name: Viz build and deploy to GitHub Pages

on:
  workflow_dispatch: # Manual trigger from GitHub UI.
  push:
    branches:
      - main
      # Demo deploy for PR review. # TODO: Remove once merged to main.
      - add-deck.gl-raster-app
    paths:
      # Limit what triggers the workflow to prevent unnecessary runs on unrelated changes.
      - "viz/**"
      - ".github/workflows/viz-deploy-pages.yml"

permissions:
  contents: read

# Allow one deployment at a time, but don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viz/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: viz/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can publish, not the build job running pnpm install.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
