##
# GitHub Actions Workflow: Lint, Test, Build, and Push Docker Image
#
# Lints with Ruff, runs tests, builds the Docker image, and pushes to
# GitHub Container Registry (GHCR) on push to main or release.
# PRs to any branch get linted, built, and tested,
# but the image is only pushed when the code actually lands on main.
#
# Action SHAs pinned for supply chain security.
# To update: visit each action's releases page, click the tag, and copy
# the full 40-char commit SHA from the tag's commit link.
# e.g. https://github.com/actions/checkout/releases/tag/v6.0.2
name: LDN lint, build, test, and push Docker image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  workflow_dispatch: # Manual trigger from GitHub UI.
  pull_request: # Any PR to any branch.
    paths:
      # Limit what triggers the workflow to prevent unnecessary runs on unrelated changes.
      - "ldn/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/ldn-lint-build-test-push.yml"
  push:
    branches:
      - main
    paths:
      # Limit what triggers the workflow to prevent unnecessary runs on unrelated changes.
      - "ldn/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/ldn-lint-build-test-push.yml"
  release:
    types:
      - created

# Cancel older runs of this workflow if a newer one is created.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          src: "ldn"

  build-test-push:
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version number
        id: get_version
        run: |
          git fetch --all --tags
          echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Build test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: test
          load: true
          tags: ldn-lulc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm ldn-lulc:test

      - name: Build production image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: final
          load: true
          tags: ldn-lulc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoketest production image
        run: docker run --rm ldn-lulc:latest ldn --help

      - name: Tag and push
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ldn-lulc:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          docker tag ldn-lulc:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Tag and push release
        if: github.event_name == 'release'
        run: |
          docker tag ldn-lulc:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          docker tag ldn-lulc:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
